<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beacon Login — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Beacon Login · zero dependencies · github.com/veraetogrex-portfolio -->
  <main class="bl" id="beacon">
    <canvas class="bl-cone" width="1160" height="760"></canvas>

    <form class="bl-card" autocomplete="off" onsubmit="return false" inert>
      <p class="bl-kicker"><i></i>Veraetogrex</p>
      <h1>Welcome back</h1>
      <p class="bl-sub">Sign in to your workspace.</p>
      <label class="bl-label" for="bl-email">Email</label>
      <input class="bl-field" id="bl-email" type="email" placeholder="you@studio.io" spellcheck="false">
      <label class="bl-label" for="bl-pass">Password</label>
      <input class="bl-field" id="bl-pass" type="password" placeholder="••••••••">
      <button class="bl-btn" type="submit">Sign in</button>
      <p class="bl-or">OR</p>
      <button class="bl-btn bl-ghost" type="button">Continue with SSO</button>
    </form>

    <canvas class="bl-dust" width="1160" height="760"></canvas>

    <svg class="bl-lamp" viewBox="0 0 1160 760" aria-hidden="true">
      <defs>
        <linearGradient id="bl-rod" x1="0" x2="1"><stop offset="0" stop-color="#1b1d26"/><stop offset=".5" stop-color="#4a4e5e"/><stop offset="1" stop-color="#1b1d26"/></linearGradient>
        <linearGradient id="bl-house" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2d39"/><stop offset=".55" stop-color="#151720"/><stop offset="1" stop-color="#0b0c11"/></linearGradient>
        <linearGradient id="bl-ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7084"/><stop offset=".5" stop-color="#2b2e3a"/><stop offset="1" stop-color="#4c5062"/></linearGradient>
        <radialGradient id="bl-lens"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#c8fff8"/><stop offset="1" stop-color="#3fe0d0" stop-opacity=".2"/></radialGradient>
        <linearGradient id="bl-gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9fffc"/><stop offset=".45" stop-color="#3fe0d0"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
        <linearGradient id="bl-gem2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c6cff" stop-opacity=".9"/><stop offset="1" stop-color="#2a1f8f"/></linearGradient>
        <filter id="bl-blur8" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="bl-blur18" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="18"/></filter>
      </defs>
      <!-- ceiling mount and rod -->
      <rect x="158" y="-6" width="56" height="14" rx="4" fill="#15171f"/>
      <rect x="184.5" y="6" width="3" height="124" fill="url(#bl-rod)"/>
      <circle cx="186" cy="134" r="7" fill="#1e2029" stroke="rgba(255,255,255,.18)"/>
      <!-- head: rotated toward the card by script.js -->
      <g class="bl-head">
        <ellipse data-glow=".55" cx="12" cy="0" rx="40" ry="80" fill="#9ff7ee" filter="url(#bl-blur18)" opacity="0"/>
        <path d="M-58 -22 L-14 -60 L-14 60 L-58 22 Z" fill="url(#bl-house)" stroke="rgba(255,255,255,.12)"/>
        <rect x="-66" y="-20" width="10" height="40" rx="3" fill="#1a1c25" stroke="rgba(255,255,255,.12)"/>
        <ellipse cx="-6" cy="0" rx="17" ry="64" fill="#07080c" stroke="url(#bl-ring)" stroke-width="7"/>
        <ellipse data-glow="1" cx="-4" cy="0" rx="11" ry="54" fill="url(#bl-lens)" opacity="0"/>
        <ellipse data-glow=".9" cx="-6" cy="0" rx="17" ry="64" fill="none" stroke="#c8fff8" stroke-width="2.4" opacity="0"/>
        <ellipse data-glow=".9" cx="0" cy="0" rx="16" ry="62" fill="none" stroke="#3fe0d0" stroke-width="8" filter="url(#bl-blur8)" opacity="0"/>
      </g>
      <!-- the cord and its crystal pendant -->
      <path class="bl-cord" fill="none" stroke="#8e92a4" stroke-width="1.6" stroke-linecap="round"/>
      <g class="bl-crystal">
        <ellipse class="bl-halo" cx="0" cy="34" rx="34" ry="44" fill="#3fe0d0" filter="url(#bl-blur18)" opacity=".5"/>
        <circle cx="0" cy="3" r="4" fill="#1e2029" stroke="#8e92a4" stroke-width="1.4"/>
        <polygon points="0,9 15,30 0,72 -15,30" fill="url(#bl-gem2)"/>
        <polygon points="0,9 15,30 0,40 -9,28" fill="url(#bl-gem)"/>
        <polygon points="0,40 15,30 0,72" fill="#3fe0d0" opacity=".55"/>
        <polyline points="0,9 15,30 0,72 -15,30 0,9" fill="none" stroke="#e9fffc" stroke-opacity=".7"/>
      </g>
    </svg>
    <div class="bl-grip" role="button" tabindex="0" aria-label="Pull the cord to switch the light (L)"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
